services:
  - type: web
    name: sonora-emotion-music
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn EmotionMusicRec.wsgi --log-file -
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: sonora-emotion-music
          property: host
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://sonora-emotion-music.onrender.com
